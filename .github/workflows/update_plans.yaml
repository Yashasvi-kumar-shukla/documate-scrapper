name: Scrape Live Telecom Plans

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraping dependencies
        run: pip install requests beautifulsoup4 lxml cloudscraper brotli

      - name: Run telecom plan scraper
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/scrape_plans.py

      - name: Commit and push updated plans.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plans.json
          git diff --staged --quiet || (git commit -m "chore: update live telecom plans" && git push)